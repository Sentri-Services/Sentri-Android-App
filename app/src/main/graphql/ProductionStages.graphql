query NativePostpartumTask($taskId: String!, $farmId: String!) {
  tasks: farm_view_task(where: {id: {_eq: $taskId}, batch: {farm_id: {_eq: $farmId}}}, limit: 1) {
    id batch_id status task_type
    batch { farm_id }
    pigs(where: {pig: {farm_id: {_eq: $farmId}}}, order_by: {pig_id: asc}) {
      pig_id disabled
      pig { id farm_id ear_tag ear_notch weight sex location_code location { unit_id unit_location pen_location } }
      postpartum_pig { task_id pig_id is_disabled check_at check_status description farrowing_at is_farrowed is_obsoleted obsoleted_reason operator_id }
    }
  }
}
query NativeLactationTask($taskId: String!, $farmId: String!) {
  tasks: farm_view_task(where: {id: {_eq: $taskId}, batch: {farm_id: {_eq: $farmId}}}, limit: 1) {
    id batch_id status task_type
    batch { farm_id }
    pigs(where: {pig: {farm_id: {_eq: $farmId}}}, order_by: {pig_id: asc}) {
      pig_id disabled
      pig { id farm_id ear_tag ear_notch weight sex location_code location { unit_id unit_location pen_location } }
      lactation_pig {
        task_id pig_id is_disabled check_at check_status description farrowing_at is_farrowed is_obsoleted obsoleted_reason operator_id
        female_count male_count no_identity_count init_total_count total_weight
        identity_piglets(order_by: {piglet_seq: asc}) { task_id pig_id piglet_seq birth_weight ear_tag ear_notch sex is_breeder }
        piglet_counts(order_by: {piglet_type: asc}) { task_id pig_id piglet_type count }
      }
    }
  }
}
query NativeNurseryTask($taskId: String!, $farmId: String!) {
  tasks: farm_view_task(where: {id: {_eq: $taskId}, batch: {farm_id: {_eq: $farmId}}}, limit: 1) {
    id batch_id status task_type
    batch { farm_id }
    pigs(where: {pig: {farm_id: {_eq: $farmId}}}, order_by: {pig_id: asc}) {
      pig_id disabled
      pig { id farm_id ear_tag ear_notch weight sex location_code location { unit_id unit_location pen_location } }
      nursery_pig { task_id pig_id has_identity is_breeder location_code }
    }
    nursery_locations(order_by: {location_code: asc}) { task_id location_code check_at created_at operator_id total_count total_weight }
  }
}
