query NativeEstrusTask($taskId: String!, $farmId: String!) {
  tasks: farm_view_task(where: {id: {_eq: $taskId}, batch: {farm_id: {_eq: $farmId}}}, limit: 1) {
    id batch_id status task_type
    batch { farm_id }
    pigs(where: {pig: {farm_id: {_eq: $farmId}}}, order_by: {pig_id: asc}) {
      pig_id disabled
      pig { id farm_id ear_tag ear_notch location_code location { unit_id unit_location pen_location } }
      estrus_pig { task_id pig_id check_status check_at is_in_estrus estrus_at }
    }
  }
}
# Contract only: no automatic replay handler is connected to this mutation.
mutation NativeCheckEstrus($input: ProductionCheckEstrusPigCommandStrawberryInput!) {
  production { check_estrus(command_input: $input) { status errors { err_msg } } }
}
mutation NativeSubmitEstrusStatus($input: ProductionSubmitEstrusStatusCommandStrawberryInput!) {
  production { submit_estrus_status(command_input: $input) { status errors { err_msg } } }
}
